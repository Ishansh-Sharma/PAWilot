[project]
name = "pawilot-agent"
version = "0.1.0"
description = "Local-first agent service for PAWilot"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "keyring>=25,<26"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

